# Render blueprint: New > Blueprint, pick this repo. Render asks for each `sync: false` value once.
# The books live in Supabase (DATABASE_URL), so a restart loses nothing. See docs/hosting.md.
services:
  - type: web
    name: sabi
    runtime: docker
    plan: free
    region: frankfurt          # the closest Render region to West Africa
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Storage: Supabase Postgres, "Session pooler" connection string (Render has no IPv6)
      - key: STORE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: SHOPS_DB          # pilot shops; the same database is fine
        sync: false
      - key: DEMO_HISTORY      # first run only: a week of trading in the demo shop
        value: "1"
      # This service's own address, e.g. https://sabi.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      # Models
      - key: LLM_BACKEND
        value: baseten
      - key: BASETEN_API_KEY
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      # WhatsApp Cloud API
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WABA_ID
        sync: false
      - key: OWNER_PHONE
        sync: false
      # Owner app and admin
      - key: OWNER_APP_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
