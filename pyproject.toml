[project]
name = "sabi"
version = "0.1.0"
description = "WhatsApp-native bookkeeping and promotion agent for Nigerian traders, built on Meta's Muse models"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "openai>=1.40",
    "meta-sam-parser>=0.0.6",
    "websockets>=12",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pillow>=10.4",
    "tzdata>=2024.1",   # zoneinfo has no time zone data on Windows without it
    "pywebpush>=2.0",   # phone notifications for pilot shops
    "onnxruntime>=1.18",   # Sabi's voice: Meta's MMS text-to-speech (app/media/speech.py)
    "numpy>=1.26",
    "edge-tts>=7.0",       # Sabi's natural voice: Nigerian English neural voices
]

[project.optional-dependencies]
dev = ["pytest>=8", "pgserver>=0.1"]   # pgserver: embedded Postgres so tests hit the real triggers

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
